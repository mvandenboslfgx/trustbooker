name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public smoke and security tests
        run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start local Supabase
        run: npx supabase start
      - name: Rebuild database from migrations
        run: npx supabase db reset
      - name: Run marketplace integration tests
        shell: bash
        run: |
          set -a
          eval "$(npx supabase status -o env)"
          set +a
          npm run test:integration
      - name: Lint rebuilt database
        run: npx supabase db lint --local --level warning
      - name: Show migration status
        run: npx supabase migration list --local
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
