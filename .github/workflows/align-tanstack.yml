name: Align TanStack Router

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/align-tanstack.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Align direct Router with React Start dependency graph
        run: npm install --save-exact @tanstack/react-router@1.170.45 --no-audit --no-fund
      - name: Validate dependency tree
        run: npm ls @tanstack/react-router @tanstack/react-start @tanstack/start-server-core
      - name: Validate application
        run: npm run validate
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove dev SSR and public routes
        run: npm run test:e2e
      - name: Commit regenerated manifest and lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency graph already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: align TanStack Router with React Start"
          git push origin HEAD:main
