name: Prepare Cloudflare lockfile
on:
  push:
    branches: [feature/trustbooker-cloudflare]
permissions:
  contents: write
jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[lock-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: npm
      - name: Resolve pinned Workers dependencies
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Validate Cloudflare build and source
        run: npm run validate
      - name: Verify Worker bundle without deploying
        run: npx wrangler deploy --dry-run
      - name: Commit generated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Cloudflare Workers dependencies [lock-generated]"
            git push origin HEAD:feature/trustbooker-cloudflare
          fi
