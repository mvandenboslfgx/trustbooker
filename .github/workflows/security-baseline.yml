name: Security baseline
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-baseline:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        shell: bash
        env:
          GOWORK: 'off'
          GOSUMDB: sum.golang.org
          GOPROXY: https://proxy.golang.org
          GONOSUMDB: ''
          GOPRIVATE: ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-bin"
          cd "$RUNNER_TEMP"
          GOBIN="$RUNNER_TEMP/security-bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Run baseline without exposing findings
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if ! bash .security/release-gate.sh > "$log" 2>&1; then
            echo "::error::Security baseline failed. Review privately in a trusted local clone."
            exit 1
          fi
          echo "Automated baseline passed. Full release protocol and owner approval are still required."
